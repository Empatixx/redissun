[package]
name = "redissun"
version = "0.23.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Empatixx/redissun"
homepage = "https://empatixx.github.io/redissun"
documentation = "https://docs.rs/redissun"
description = "Redisson for Rust: a Redis library with std-style collections, distributed locks, caches and streams."
readme = "README.md"
exclude = ["website/", "docs/", ".github/", "benches/redisson/", "benches/results/", "benches/plot.py"]
keywords = ["redis", "redisson", "distributed-lock", "redis-client", "cache"]
categories = ["asynchronous", "concurrency", "database"]

[dependencies]
bytes = "1"
futures = "0.3"
highway = "1.3"
serde = "1"
serde_json = "1"
sha1_smol = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "io-util"] }
tokio-util = "0.7"
url = "2"
socket2 = { version = "0.5", features = ["all"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "logging"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
redis = { version = "1.8", default-features = false, features = ["bytes", "aio", "tokio-comp"] }
uuid = { version = "1", features = ["v4"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
moka = { version = "0.12", default-features = false, features = ["sync"], optional = true }

[features]
tls-rustls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-native-certs", "rustls/ring", "tokio-rustls/ring"]
tls-rustls-aws-lc = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-native-certs", "rustls/aws_lc_rs", "tokio-rustls/aws_lc_rs"]
moka = ["dep:moka"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
# Only for benches/compare.rs, which measures redissun against fred.
fred = { version = "10.1", default-features = false, features = ["i-std", "i-hashes", "i-keys", "i-scripts", "transactions", "sha-1"] }
libc = "0.2"
rcgen = "0.14"
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
testcontainers = { version = "0.27", features = ["properties-config"] }
testcontainers-modules = { version = "0.15", features = ["redis"] }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[[bench]]
name = "compare"
harness = false
