[package]
name = "redissun"
version = "0.16.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Empatixx/redissun"
description = "Distributed objects on Redis for Rust, inspired by Redisson: HashMap, Vec, HashSet, reentrant Lock with watchdog"
readme = "README.md"
exclude = ["website/", "docs/", ".github/"]
keywords = ["redis", "distributed-lock", "redisson", "tokio", "async"]
categories = ["asynchronous", "concurrency", "database"]

[dependencies]
async-trait = "0.1"
bytes = "1"
fred = { version = "10.1", default-features = false, features = ["i-std", "i-hashes", "i-lists", "i-sets", "i-sorted-sets", "i-streams", "transactions", "i-client", "i-keys", "i-scripts", "i-pubsub", "i-cluster", "sentinel-client", "subscriber-client", "sha-1", "credential-provider"] }
futures = "0.3"
highway = "1.3"
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-util = "0.7"
lru = "0.18"
uuid = { version = "1", features = ["v4"] }

[features]
tls-rustls = ["fred/enable-rustls-ring"]
tls-rustls-aws-lc = ["fred/enable-rustls"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dev-dependencies]
libc = "0.2"
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["redis"] }
tokio = { version = "1", features = ["full"] }
